@startuml
title: Маршрутизация и доставка перевода

participant  "Платёжный\nшлюз СПФС/CIPS" as Gateway
participant  "Outbox\nWorker Маршрутизации" as OutboxRouting
database     "БД Маршрутизации" as RoutingDB
participant  "МС Маршрутизации" as Routing
queue        "Kafka" as Kafka
participant  "Outbox\nWorker Переводов" as OutboxTransfer
database     "БД Переводов" as DB
participant  "МС Переводов" as Transfer
participant  "МС Возвратов" as Refund
database     "БД Возвратов" as RefundDB
participant  "Банк-\nотправитель" as Bank
participant  "МС Уведомлений" as Notify
actor        "Отправитель" as User

autonumber

Kafka ->> Routing : Событие transfer.created\n(transfer_id, amount, currency_to)
activate Routing

Routing -> Routing : Выбор маршрута:\nRUB → KZT: СПФС\nRUB → CNY: CIPS

Routing -> RoutingDB : INSERT INTO routing_rules (выбранный коннектор)\n+ INSERT INTO outbox_routing ('transfer.sent_to_gateway')
activate RoutingDB
RoutingDB --> Routing : OK
deactivate RoutingDB

Routing -> Gateway : POST /transfers
activate Gateway
Gateway --> Routing : 202 OK {transaction_id}
deactivate Gateway

Routing -> RoutingDB : UPDATE routing_attempts (status = SUCCESS)
activate RoutingDB
RoutingDB --> Routing : OK
deactivate RoutingDB
deactivate Routing

activate OutboxRouting
OutboxRouting -> RoutingDB : SELECT FROM outbox_routing WHERE status = 'PENDING'
activate RoutingDB
RoutingDB --> OutboxRouting : Лог 'transfer.sent_to_gateway'
deactivate RoutingDB
OutboxRouting ->> Kafka : Публикация transfer.sent_to_gateway
activate Kafka
Kafka -->> OutboxRouting : Подтверждение
deactivate Kafka
OutboxRouting -> RoutingDB : UPDATE outbox_routing SET status = 'PUBLISHED'
deactivate OutboxRouting

Kafka ->> Transfer : Событие transfer.sent_to_gateway
activate Transfer
Transfer -> DB : UPDATE transfers (status = PROCESSING version = 3)
activate DB
DB --> Transfer : OK
deactivate DB
deactivate Transfer

Gateway -> Routing : POST /webhooks/spfs\n{transaction_id, status = COMPLETED}
activate Gateway
activate Routing
Routing --> Gateway: 202 Accepted (OK)
deactivate Gateway

Routing -> RoutingDB : UPDATE spfs_transactions (status = COMPLETED)\n+ INSERT INTO outbox_routing ('transfer.completed')
activate RoutingDB
RoutingDB --> Routing : OK
deactivate RoutingDB
deactivate Routing

activate OutboxRouting
OutboxRouting -> RoutingDB : SELECT FROM outbox_routing WHERE status = 'PENDING'
activate RoutingDB
RoutingDB --> OutboxRouting : Лог 'transfer.completed'
deactivate RoutingDB
OutboxRouting ->> Kafka : Публикация события transfer.completed\n{transfer_id, gateway_transaction_id}
activate Kafka
Kafka -->> OutboxRouting : Подтверждение
deactivate Kafka
OutboxRouting -> RoutingDB : UPDATE outbox_routing SET status = 'PUBLISHED'
deactivate OutboxRouting

Kafka ->> Transfer : Событие transfer.completed
activate Transfer
Transfer -> DB : UPDATE transfers (status = COMPLETED)\nINSERT transfer_statuses
activate DB
DB --> Transfer : OK
deactivate DB

Transfer -> Bank : Запрос на фактическое списание денежных средств
activate Bank
Bank --> Transfer : Списание подтверждено
deactivate Bank

Transfer -> DB : INSERT INTO outbox_transfers ('transfer.status_changed')
activate DB
DB --> Transfer : OK
deactivate DB
deactivate Transfer

activate OutboxTransfer
OutboxTransfer -> DB : SELECT FROM outbox_transfers WHERE status = 'PENDING'
activate DB
DB --> OutboxTransfer : Лог 'transfer.status_changed'
deactivate DB
OutboxTransfer ->> Kafka : Публикация transfer.status_changed
activate Kafka
Kafka -->> OutboxTransfer : Подтверждение
deactivate Kafka
OutboxTransfer -> DB : UPDATE outbox_transfers SET status = 'PUBLISHED'
deactivate OutboxTransfer

Kafka ->> Notify : Событие transfer.status_changed
activate Notify
Notify --> User : Push: "Перевод завершён"
deactivate Notify


alt [Шлюз недоступен или отклонил перевод]
        activate Routing
    loop До 3 попыток 
        Routing -> Gateway : POST /transfers
        activate Gateway
        Gateway --> Routing : Таймаут или ошибка 
        deactivate Gateway

        Routing -> RoutingDB : UPDATE routing_attempts (status = FAILED)
        activate RoutingDB
        RoutingDB --> Routing : OK
        deactivate RoutingDB

        Routing -> RoutingDB : INSERT routing_attempts 
        activate RoutingDB
        RoutingDB --> Routing : OK
        deactivate RoutingDB
        deactivate Routing
    end

    activate Routing
    Routing -> RoutingDB : UPDATE routing_attempts (status = FAILED)\n+ INSERT INTO outbox_routing ('transfer.failed')
    activate RoutingDB
    RoutingDB --> Routing : OK
    deactivate RoutingDB
    deactivate Routing

    activate OutboxRouting
    OutboxRouting -> RoutingDB : SELECT FROM outbox_routing WHERE status = 'PENDING'
    activate RoutingDB
    RoutingDB --> OutboxRouting : Лог 'transfer.failed'
    OutboxRouting ->> Kafka : Публикация события transfer.failed
    activate Kafka
    Kafka -->> OutboxRouting : Подтверждение
    deactivate Kafka
    OutboxRouting -> RoutingDB : UPDATE outbox_routing SET status = 'PUBLISHED'
    deactivate OutboxRouting
    deactivate RoutingDB
    Kafka ->> Transfer : Событие transfer.failed
    activate Transfer
    Transfer -> DB : UPDATE transfers (status = FAILED)\nINSERT transfer_statuses
    activate DB
    DB --> Transfer : OK
    deactivate DB

    Kafka ->> Refund : Событие transfer.failed
        activate Refund
        Refund -> RefundDB : INSERT INTO refunds (status = PROCESSING)
        activate RefundDB
        RefundDB --> Refund : OK
        deactivate RefundDB

        Refund -> Bank : Запрос на отмену холдирования
        activate Bank
        Bank --> Refund : Холд отменён
        deactivate Bank

        Refund -> RefundDB : Транзакция:\n- UPDATE refunds (status = COMPLETED)\n- INSERT INTO outbox_refunds ('refund.completed')
        activate RefundDB
        RefundDB --> Refund : OK
        deactivate RefundDB
        deactivate Refund

        activate OutboxRefund
        OutboxRefund -> RefundDB : SELECT FROM outbox_refunds WHERE status = 'PENDING'
        activate RefundDB
        RefundDB --> OutboxRefund : Событие 'refund.completed'
        OutboxRefund ->> Kafka : Публикация в refund_events ('refund.completed')
        activate Kafka
        Kafka -->> OutboxRefund : ACK
        deactivate Kafka
        OutboxRefund -> RefundDB : UPDATE outbox_refunds SET status = 'PUBLISHED'
        deactivate OutboxRefund
        deactivate RefundDB
    Transfer -> DB : UPDATE transfers (status = REFUNDED)\n+ INSERT INTO outbox_transfers ('transfer.status_changed')
    activate DB
    DB --> Transfer : OK
    deactivate DB
    deactivate Transfer

    activate OutboxTransfer
    OutboxTransfer -> DB : SELECT FROM outbox_transfers WHERE status = 'PENDING'
    activate DB
    DB --> OutboxTransfer : Лог 'transfer.status_changed'
    OutboxTransfer ->> Kafka : Публикация transfer.status_changed
    activate Kafka
    Kafka -->> OutboxTransfer : Подтверждение
    deactivate Kafka
    OutboxTransfer -> DB : UPDATE outbox_transfers SET status = 'PUBLISHED'
    deactivate OutboxTransfer
    deactivate DB
    Kafka ->> Notify : Событие transfer.status_changed
    activate Notify
    Notify --> User : Push: "Перевод не удался, средства возвращены"
    deactivate Notify

end
@enduml
