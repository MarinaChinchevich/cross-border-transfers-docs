@startuml
title: Маршрутизация и доставка перевода 
participant  "Платёжный\nшлюз СПФС/CIPS " as Gateway
participant  "МС Маршрутизации " as Routing
database  "БД Маршрутизации " as RoutingDB
queue  "Kafka " as Kafka
participant  "МС Переводов " as Transfer
database  "БД Переводов " as DB
participant  "Банк-\nотправитель " as Bank
participant  "МС Уведомлений " as Notify
actor  "Отправитель " as User

autonumber

Kafka ->> Routing : Событие transfer.created\n(transfer_id, amount, currency_to)
activate Routing
Routing -> Routing : Выбор маршрута:\nRUB → KZT: СПФС\nRUB → CNY: CIPS

Routing -> RoutingDB : NSERT routing_rules (выбранный коннектор)
activate RoutingDB
RoutingDB --> Routing : OK
deactivate RoutingDB

Routing -> Gateway : POST /transfers
activate Gateway
Gateway --> Routing : 200 OK {transaction_id}
deactivate Gateway

Routing -> RoutingDB : UPDATE routing_attempts (status = SUCCESS)
activate RoutingDB
RoutingDB --> Routing : OK
deactivate RoutingDB

Routing -->> Kafka : Публикация transfer.sent_to_gateway
activate Kafka
Kafka -->> Routing : Подтверждение
deactivate Kafka
deactivate Routing

Kafka ->> Transfer : Событие transfer.sent_to_gateway
activate Transfer
Transfer -> DB : UPDATE transfers (status = PROCESSING)
activate DB
DB --> Transfer : OK
deactivate DB

Gateway -> Routing : POST /webhooks/spfs\n{transaction_id, status = COMPLETED}
activate Gateway
activate Routing
Routing --> Gateway: OK
deactivate Gateway
Routing -> RoutingDB : UPDATE spfs_transactions (status = COMPLETED)
activate RoutingDB
RoutingDB --> Routing : OK
deactivate RoutingDB
Routing -->> Kafka : Публикация transfer.completed\n{transfer_id, gateway_transaction_id}
activate Kafka
Kafka -->> Routing : Подтверждение
deactivate Kafka
deactivate Routing

Kafka ->> Transfer : Событие transfer.completed
Transfer -> DB : UPDATE transfers (status = COMPLETED)\nINSERT transfer_statuses
activate DB
DB --> Transfer : OK
deactivate DB
Transfer -> Bank : Запрос на фактическое списание денежных средств
activate Bank
Bank --> Transfer : Списание подтверждено
deactivate Bank
Transfer -->> Kafka : Публикация transfer.status_changed
activate Kafka
Kafka -->> Transfer : Подтверждение
deactivate Kafka
deactivate Transfer

Kafka ->> Notify : Событие transfer.status_changed
activate Notify
Notify --> User : Push: "Перевод завершён"
deactivate Notify

alt [Шлюз недоступен или отклонил перевод]
    loop До 3 попыток 
        Routing -> Gateway : POST /transfers
        activate Routing
        activate Gateway
        Gateway --> Routing : Таймаут или ошибка (5 сек)
        deactivate Gateway

        Routing -> RoutingDB : UPDATE routing_attempts (status = FAILED)
        activate RoutingDB
        RoutingDB --> Routing : OK
        deactivate RoutingDB

        Routing -> RoutingDB : INSERT routing_attempts (attempt++)
        activate RoutingDB
        RoutingDB --> Routing : OK
        deactivate RoutingDB
    end

    Routing -> RoutingDB : UPDATE routing_attempts (status = FAILED)
    activate RoutingDB
    RoutingDB --> Routing : OK
    deactivate RoutingDB

    Routing -->> Kafka : Публикация transfer.failed
    activate Kafka
    Kafka -->> Routing : Подтверждение
    deactivate Routing

    Kafka ->> Transfer : Событие transfer.failed
    deactivate Kafka
    activate Transfer
    Transfer -> DB : UPDATE transfers (status = FAILED/REJECTED)\nINSERT transfer_statuses
    activate DB
    DB --> Transfer : OK
    deactivate DB
    Transfer -> Bank : Запрос на отмену холдирования
    activate Bank
    Bank --> Transfer : Холд отменён
    deactivate Bank
    Transfer -> DB : UPDATE transfers (status = REFUNDED)
    activate DB
    DB --> Transfer : OK
    deactivate DB
    Transfer -->> Kafka : Публикация transfer.status_changed
    activate Kafka
    Kafka -->> Transfer : Подтверждение
    deactivate Transfer

    Kafka ->> Notify : Событие transfer.status_changed
    activate Notify
    deactivate Kafka
    Notify --> User : Push: "Перевод не удался, средства возвращены"
    deactivate Notify

end

@enduml