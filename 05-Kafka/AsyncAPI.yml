asyncapi: 3.0.0
info:
  title: Система трансграничных переводов — Kafka Contracts
  version: 1.0.0
  description: |
    Асинхронные события, обеспечивающие взаимодействие микросервисов 
    системы трансграничных переводов через Apache Kafka.
    Гарантируется доставка at-least-once.
    Неподтверждённые события после 10 попыток попадают в DLQ 
      
channels:
  transfer_events:
    address: transfer_events
    description: |
      Основной топик для операционных событий жизненного цикла перевода.
      Потребители фильтруют сообщения по полю 'event_type' в payload
    messages:
      TransferEventMessage:
        $ref: '#/components/messages/TransferEventMessage'
  
  transfer_events.DLQ:
    address: transfer_events.DLQ
    description: Очередь мертвых писем для необработанных операционных сбоев топика переводов 
    messages:
      TransferEventMessage:
        $ref: '#/components/messages/TransferEventMessage'

  transfer_status_changed:
    address: transfer_status_changed
    description: |
      Топик для аудиторских событий изменения статуса перевода.
      Хранится 5 лет согласно требованиям ЦБ РФ и 152-ФЗ.
    messages:
      TransferStatusChangedMessage:
        $ref: '#/components/messages/TransferStatusChangedMessage'

  transfer_status_changed.DLQ:
    address: transfer_status_changed.DLQ
    description: Очередь мертвых писем для сбоев логов аудита статусов
    messages:
      TransferStatusChangedMessage:
        $ref: '#/components/messages/TransferStatusChangedMessage'

  refund_events:
    address: refund_events
    description: |
      Топик для событий процесса возврата средств
    messages:
      RefundEventMessage:
        $ref: '#/components/messages/RefundEventMessage'

  refund_events.DLQ:
    address: refund_events.DLQ
    description: Очередь мертвых писем для сбоев процессов компенсирующих возвратов
    messages:
      RefundEventMessage:
        $ref: '#/components/messages/RefundEventMessage'

operations:
  publishTransferEvent:
    action: send
    channel:
      $ref: '#/channels/transfer_events'
    summary: Публикация операционного события перевода
    description: МС Переводов или МС Маршрутизации публикует событие при изменении состояния перевода через Outbox Worker

  consumeTransferEvent:
    action: receive
    channel:
      $ref: '#/channels/transfer_events'
    summary: Обработка операционного события перевода
    description: МС Маршрутизации, МС Переводов или МС Возвратов обрабатывают событие в зависимости от 'event_type'

  publishTransferStatusChanged:
    action: send
    channel:
      $ref: '#/channels/transfer_status_changed'
    summary: Публикация события изменения статуса
    description: МС Переводов публикует событие при любом изменении статуса аудита и уведомлений через Outbox Worker

  consumeTransferStatusChanged:
    action: receive
    channel:
      $ref: '#/channels/transfer_status_changed'
    summary: Обработка события изменения статуса
    description: МС Уведомлений принимает изменение статуса перевода отправляет Push-уведомление пользователю 

  publishRefundEvent:
    action: send
    channel:
      $ref: '#/channels/refund_events'
    summary: Публикация события возврата средств
    description: МС Возвратов публикует событие при инициации, завершении или ошибке возврата

  consumeRefundEvent:
    action: receive
    channel:
      $ref: '#/channels/refund_events'
    summary: Изменение лимитов перевода при возврате
    description: |
      МС Переводов слушает событие refund.completed, чтобы перевести перевод в финальный статус REFUNDED и уменьшить счетчики daily_spent 
      и monthly_spent в таблице лимитов, возвращая клиенту его доступный суточный баланс

  consumeTransferEventsDLQ:
    action: receive
    channel:
      $ref: '#/channels/transfer_events.DLQ'
    summary: Ручной разбор сбоев в transfer_events (DLQ)
    description: Дежурная служба поддержки вычитывает сообщения из DLQ при критических ошибках десериализации.

  consumeTransferStatusChangedDLQ:
    action: receive
    channel:
      $ref: '#/channels/transfer_status_changed.DLQ'
    summary: Ручной разбор сбоев в логировании статусов (DLQ)

  consumeRefundEventsDLQ:
    action: receive
    channel:
      $ref: '#/channels/refund_events.DLQ'
    summary: Ручной разбор сбоев в контуре возвратов (DLQ)

components:
  messages:
    TransferEventMessage:
      name: TransferEventMessage
      title: Операционное событие перевода
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: Ключ партиционирования сообщений. Используется transfer_id перевода для соблюдения очередности сообщений
      headers:
        type: object
        required: [timestamp, message_id, idempotency_key]
        properties:
          timestamp:
            type: string
            format: date-time
            description: Дата и время публикации события 
          message_id:
            type: string
            format: uuid
            description: Уникальный идентификатор сообщения для сквозного логирования
          idempotency_key:
            type: string
            format: uuid
            description: Ключ идемпотентности для предотвращения дублирования 
      payload:
        $ref: '#/components/schemas/TransferEventPayload'

    TransferStatusChangedMessage:
      name: TransferStatusChangedMessage
      title: Событие изменения статуса перевода 
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: Ключ партиционирования сообщений. Используется transfer_id перевода для соблюдения очередности сообщений
      headers:
        type: object
        required: [timestamp, message_id, idempotency_key]
        properties:
          timestamp:
            type: string
            format: date-time
          message_id:
            type: string
            format: uuid
          idempotency_key:
            type: string
            format: uuid
      payload:
        $ref: '#/components/schemas/TransferStatusChangedPayload'

    RefundEventMessage:
      name: RefundEventMessage
      title: Событие возврата средств
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: Ключ партиционирования сообщений. Используется transfer_id перевода для соблюдения очередности сообщений
      headers:
        type: object
        required: [timestamp, message_id, idempotency_key]
        properties:
          timestamp:
            type: string
            format: date-time
          message_id:
            type: string
            format: uuid
          idempotency_key:
            type: string
            format: uuid
      payload:
        $ref: '#/components/schemas/RefundEventPayload'

  schemas:
    TransferEventPayload:
      type: object
      required: [event_type, transfer_id, user_id, created_at]
      properties:
        event_type:
          type: string
          enum: [transfer.created, transfer.sent_to_gateway, transfer.completed, transfer.failed]
          description: Тип события для маршрутизации внутри потребителя
        transfer_id:
          type: string
          format: uuid
          description: Уникальный идентификатор перевода 
        user_id:
          type: string
          format: uuid
          description: Внешний ID отправителя 
        amount:
          type: string
          description: Сумма перевода
        currency_from:
          type: string
          enum: [RUB]
          description: Валюта отправителя 
        currency_to:
          type: string
          enum: [KZT, CNY]
          description: Валюта получателя 
        exchange_rate:
          type: string
          description: Зафиксированный курс
        commission:
          type: string
          description: Комиссия за перевод
        total_amount:
          type: string
          description: Итоговая сумма к списанию
        status:
          type: string
          enum: [PENDING, APPROVED, PROCESSING, COMPLETED, BLOCKED, REJECTED, FAILED, MANUAL_REVIEW, REFUNDED]
          description: Текущий статус перевода
        country_to:
          type: string
          description: Страна получателя 
        beneficiary_id:
          type: string
          format: uuid
          description: Уникальный идентификатор бенефициара
        payment_purpose:
          type: string
          description: Цель платежа
        hold_expires_at:
          type: string
          format: date-time
          description: Время истечения холдирования средств
        fx_rate_expires_at:
          type: string
          format: date-time
          description: Время истечения периода зафиксированного курса
        connector_type:
          type: string
          enum: [SPFS, CIPS]
          description: Заполняется при event_type = sent_to_gateway, completed, failed
        gateway_transaction_id:
          type: string
          description: |
            Внешний ID транзакции в платёжной системе.
            Значение берётся из spfs_transactions.spfs_id или cips_transactions.cips_id
            в зависимости от поля connector_type 
        version:
          type: integer
          description: Номер версии записи перевода
        error_code:
          type: string
          description: Заполняется при event_type = failed 
        error_message:
          type: string
          description: Заполняется при event_type = failed
        created_at:
          type: string
          format: date-time
          description: Дата создания перевода

    TransferStatusChangedPayload:
      type: object
      required: [transfer_id, user_id, old_status, new_status, changed_at]
      properties:
        transfer_id:
          type: string
          format: uuid
          description: Уникальный идентификатор перевода
        user_id:
          type: string
          format: uuid
          description: Внешний ID отправителя
        old_status:
          type: string
          enum: [PENDING, APPROVED, PROCESSING, COMPLETED, BLOCKED, REJECTED, FAILED, MANUAL_REVIEW, REFUNDED]
          description: Предыдущий статус. Принимает null для самой первой записи PENDING
        new_status:
          type: string
          enum: [PENDING, APPROVED, PROCESSING, COMPLETED, BLOCKED, REJECTED, FAILED, MANUAL_REVIEW, REFUNDED]
          description: Новый статус
        initiator:
          type: string
          enum: [USER, SYSTEM, COMPLIANCE_OFFICER, PAYMENT_GATEWAY]
          description: Инициатор, совершивший изменение статуса перевода
        reason:
          type: string
          description: Причина изменения статуса 
        changed_at:
          type: string
          format: date-time
          description: Дата и время изменения

    RefundEventPayload:
      type: object
      required: [event_type, refund_id, transfer_id, user_id, created_at]
      properties:
        event_type:
          type: string
          enum: [refund.initiated, refund.completed, refund.failed]
          description: Тип события возврата
        refund_id:
          type: string
          format: uuid
          description: Уникальный идентификатор возврата 
        transfer_id:
          type: string
          format: uuid
          description: Уникальный идентификатор исходного перевода
        user_id:
          type: string
          format: uuid
          description: Внешний ID отправителя
        amount:
          type: string
          description: Сумма возврата
        currency:
          type: string
          enum: [RUB]
          description: Валюта возврата
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, ESCALATED]
          description: Текущий статус возврата
        reason:
          type: string
          description: Причина возврата
        attempt_count:
          type: integer
          description: Количество попыток возврата
        error_message:
          type: string
          description: Заполняется при event_type = refund.failed
        created_at:
          type: string
          format: date-time
          description: Дата создания записи о возврате
        updated_at:
          type: string
          format: date-time
          description: Дата последнего обновления записи о возврате

  correlationIds:
    transferCorrelationId:
      description: Идентификатор перевода для сквозного отслеживания
      location: $message.payload#/transfer_id