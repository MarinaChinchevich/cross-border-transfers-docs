@startuml

title: Создание перевода 

actor "Отправитель" as User
participant "Мобильное\nприложение" as App
participant "API Gateway" as GW
participant "МС Переводов" as Transfer
database "БД Переводов" as DB
participant "Outbox\nWorker" as OutboxWorker
participant "МС Курса\nвалют (SSE)" as FX
participant "Банк-\nотправитель" as Bank
participant "МС Комплаенс" as AML
queue "Kafka" as Kafka

autonumber

User -> App : Выбирает страну получателя и валюту перевода
activate App
App -> FX : SSE-подписка на курс 
activate FX

loop Обновление курса каждые 30 сек
    FX --> App : Обновление курса + пересчёт комиссии
end
deactivate FX
User -> App : Вводит сумму, реквизиты бенефициара, цель платежа
App -> GW : POST /fx/rates/lock
activate GW
GW -> Transfer : Пересылает запрос фиксации курса
activate Transfer
Transfer -> DB : INSERT INTO fx_rate_history
activate DB
DB --> Transfer : OK (Запись фиксации курса)
deactivate DB
Transfer --> GW : 201 Created {fx_rate_lock_id, total_amount}
GW --> App : Данные фиксации курса
deactivate Transfer
deactivate GW
User -> App : Нажимает "Подтвердить"
App -> GW : POST /transfers\n[Idempotency-Key]
activate GW
GW -> Transfer : Пересылает запрос {fx_rate_lock_id, amount, beneficiary}
activate Transfer

Transfer -> DB : Проверка Idempotency-Key, лимитов, валидности fx_rate_lock_id
activate DB
DB --> Transfer : ОК (Курс активен)
Transfer -> DB : Транзакция:\n- INSERT INTO transfers (status = PENDING, version = 1)\n- INSERT INTO transfer_statuses (old_status = NULL, new_status = PENDING)
DB --> Transfer : OK (transfer_id создан)
deactivate DB

Transfer -> Bank : Запрос на холдирование 
    activate Bank
    Bank --> Transfer : Холд подтверждён
    deactivate Bank

    Transfer -> AML : Комплаенс-проверка 
    activate AML
    AML --> Transfer : risk_level = LOW
    deactivate AML

    Transfer -> DB : ACID Транзакция:\n- INSERT INTO transfers (status = APPROVED)\n- INSERT INTO transfer_statuses (new_status = APPROVED)\n- INSERT INTO outbox_transfers (event = 'transfer.created')
    activate DB
    DB --> Transfer : Транзакция успешна
    deactivate DB

    Transfer --> GW : 201 Created {transfer_id, status: APPROVED}
    GW --> App : Данные перевода
    App --> User : "Перевод принят в обработку"
alt Превышен лимит или истёк курс
    Transfer -> DB : Проверка лимитов
    activate DB
    DB --> Transfer : Лимит исчерпан
    deactivate DB
    Transfer --> GW : 422 LIMIT_EXCEEDED/FX_RATE_EXPIRED
    GW --> App : Ошибка валидации
    App --> User : "Сообщение об ошибке"
else Недостаточно средств 
    Transfer -> Bank : Запрос на холдирование
    activate Bank
    Bank --> Transfer : Ошибка INSUFFICIENT_FUNDS
    deactivate Bank
    Transfer --> GW : 422 INSUFFICIENT_FUNDS
    GW --> App : Ошибка
    App --> User : "Недостаточно средств"
else risk_level = HIGH 
    Transfer -> Bank : Запрос на холдирование 
    activate Bank
    Bank --> Transfer : Холд подтверждён
    deactivate Bank
    Transfer -> AML : Комплаенс-проверка
    activate AML
    AML --> Transfer : risk_level = HIGH
    deactivate AML
    Transfer -> Bank : Отмена холдирования 
    activate Bank
    Bank --> Transfer : Холд отменён
    deactivate Bank
    Transfer -> DB : Транзакция: INSERT INTO transfers (status = BLOCKED version = 2)
    activate DB
    DB --> Transfer : OK
    deactivate DB
    Transfer --> GW : 201 Created {status: BLOCKED}
    GW --> App : Перевод заблокирован
    App --> User : "Перевод отклонён службой безопасности"
else risk_level = MEDIUM 
    Transfer -> Bank : Запрос на холдирование 
    activate Bank
    Bank --> Transfer : Холд подтверждён
    deactivate Bank
    Transfer -> AML : Комплаенс-проверка
    activate AML
    AML --> Transfer : risk_level = MEDIUM
    deactivate AML
    Transfer -> DB : Транзакция: INSERT INTO transfers (status = MANUAL_REVIEW version = 2)
    activate DB
    DB --> Transfer : OK
    deactivate DB
    Transfer --> GW : 201 Created {status: MANUAL_REVIEW}
    GW --> App : Перевод на проверке
    App --> User : "Перевод на проверке до 24 часов"
end

deactivate Transfer
deactivate GW
deactivate App

== Асинхронный цикл доставки событий (Transactional Outbox) ==
loop Постоянный опрос (Polling) outbox-таблицы воркером
    OutboxWorker -> DB : SELECT FROM outbox_transfers WHERE status = 'PENDING'
    activate DB
    activate OutboxWorker
    DB --> OutboxWorker : Список событий
    OutboxWorker -> Kafka : Публикация события transfer.created [Key: transfer_id]
    activate Kafka
    Kafka -->> OutboxWorker : Подтверждение (ACK) публикации
    deactivate Kafka
    OutboxWorker -> DB : UPDATE outbox_transfers SET status = 'PUBLISHED'
    deactivate DB
    deactivate OutboxWorker
end

@enduml
